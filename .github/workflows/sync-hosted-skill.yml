name: Sync hosted skill

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [hosted-skill-updated]

permissions:
  contents: write

concurrency:
  group: sync-hosted-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the hosted skill and the reference files it links to
        run: |
          set -euo pipefail
          curl -fsSL https://www.ravion.com/SKILL.md -o skills/use-ravion/SKILL.md
          grep -o 'https://www\.ravion\.com/skills/use-ravion/[a-z0-9-]*\.md' skills/use-ravion/SKILL.md |
            sort -u |
            while read -r url; do
              curl -fsSL "$url" -o "skills/use-ravion/$(basename "$url")"
            done
      - name: Verify the mirror matches the hosted skill
        run: |
          set -euo pipefail
          test -s skills/use-ravion/SKILL.md
          head -1 skills/use-ravion/SKILL.md | grep -qx -- '---'
          grep -q '^name: use-ravion$' skills/use-ravion/SKILL.md
          for url in $(grep -o 'https://www\.ravion\.com/skills/use-ravion/[a-z0-9-]*\.md' skills/use-ravion/SKILL.md | sort -u); do
            file="skills/use-ravion/$(basename "$url")"
            test -s "$file" || { echo "missing reference $file"; exit 1; }
          done
      - name: Bump the plugin manifests when the skill changed
        id: bump
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/use-ravion; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(jq -r .version plugins/ravion/.claude-plugin/plugin.json)
          next=$(echo "$version" | awk -F. '{print $1"."$2"."$3+1}')
          for manifest in plugins/ravion/.*-plugin/plugin.json; do
            jq --arg v "$next" '.version = $v' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Commit the sync
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/use-ravion plugins/ravion
          git commit -m "Sync use-ravion from www.ravion.com (plugins ${{ steps.bump.outputs.version }})"
          git push
